<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôle d'Entrée - Scanner QR Code</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- html5-qrcode Library CDN pour le scan caméra -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- HEADER -->
    <header class="w-full max-w-md text-center py-4">
        <h1 class="text-xl font-bold">📷 Contrôle d'Entrée</h1>
        <p class="text-xs text-slate-400">Scannez le QR Code de l'invité</p>
    </header>

    <!-- ZONE DE SCAN CAMÉRA -->
    <main class="w-full max-w-md flex flex-col items-center space-y-6">
        
        <!-- Fenêtre de la caméra -->
        <div id="reader" class="w-full bg-slate-800 rounded-2xl overflow-hidden shadow-lg border border-slate-700"></div>

        <!-- RÉSULTAT DU SCAN -->
        <div id="scan-result" class="w-full p-6 rounded-2xl shadow-lg hidden text-center transition-all duration-300">
            <div id="result-icon" class="text-4xl mb-2"></div>
            <h2 id="result-title" class="text-2xl font-bold mb-1"></h2>
            <p id="result-details" class="text-sm opacity-90"></p>
            <button onclick="resetScanner()" class="mt-4 bg-white text-slate-900 px-6 py-2 rounded-xl font-semibold shadow hover:bg-slate-100 transition">Scanner un autre billet</button>
        </div>

        <!-- RECHERCHE MANUELLE DE SECOURS -->
        <div class="w-full bg-slate-800 p-4 rounded-2xl border border-slate-700">
            <h3 class="text-sm font-bold text-slate-300 mb-2">🔍 Recherche manuelle (Secours)</h3>
            <div class="flex gap-2">
                <input type="text" id="manual-search-input" placeholder="Nom de l'invité..." class="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded-xl text-sm outline-none focus:border-indigo-500">
                <button onclick="searchGuestManually()" class="bg-indigo-600 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">Chercher</button>
            </div>
            <div id="manual-search-results" class="mt-3 space-y-2"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-xs text-slate-500 py-4">
        Mariage - Gestion des entrées sécurisée
    </footer>

    <!-- LOGIQUE JAVASCRIPT -->
    <script>
        const SUPABASE_URL = 'https://ginzxpneasqsmxpnpjjz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IP_PwNBO095yPbPg6Me-fw_iPiVj-IP';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let html5QrCode;
        let isScanningActive = true;

        // Initialisation de la caméra au chargement de la page
        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                { facingMode: "environment" }, // Utilise la caméra arrière du smartphone
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Erreur d'accès à la caméra :", err);
                alert("Impossible d'accéder à la caméra. Vérifiez les autorisations du navigateur (HTTPS requis sur mobile).");
            });
        }

        function onScanFailure(error) {
            // Ignorer les erreurs de scan en continu (tant qu'aucun QR code n'est détecté dans le champ)
        }

        // Action lorsqu'un QR Code est détecté avec succès
        async function onScanSuccess(decodedText) {
            if (!isScanningActive) return;
            isScanningActive = false;
            
            // Arrêter temporairement la caméra pendant le traitement
            await html5QrCode.pause();

            // Le texte du QR Code est l'ID unique (UUID) de l'invité
            await verifyAndCheckInGuest(decodedText);
        }

        // Vérification et validation dans Supabase
        async function verifyAndCheckInGuest(guestId) {
            const resultBox = document.getElementById('scan-result');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultDetails = document.getElementById('result-details');

            resultBox.classList.remove('hidden', 'bg-green-600', 'bg-amber-500', 'bg-red-600');

            // 1. Récupérer l'invité et sa table
            const { data: guest, error } = await supabaseClient
                .from('guests')
                .select('*, tables(table_name)')
                .eq('id', guestId)
                .single();

            if (error || !guest) {
                resultBox.classList.add('bg-red-600');
                resultIcon.textContent = "❌";
                resultTitle.textContent = "Billet Invalide";
                resultDetails.textContent = "Cet invité n'a pas été trouvé dans la base de données.";
                resultBox.classList.remove('hidden');
                return;
            }

            // 2. Vérifier si l'invité a déjà été scanné (Doublon)
            if (guest.checked_in) {
                resultBox.classList.add('bg-amber-500');
                resultIcon.textContent = "⚠️";
                resultTitle.textContent = "Déjà scanné !";
                resultDetails.innerHTML = `<strong>${guest.full_name}</strong> est déjà entré(e) à <span class="underline">${new Date(guest.checked_in_at).toLocaleTimeString()}</span>.`;
                resultBox.classList.remove('hidden');
                return;
            }

            // 3. Valider l'entrée (Passer checked_in à TRUE)
            const now = new Date().toISOString();
            const { error: updateError } = await supabaseClient
                .from('guests')
                .update({ checked_in: true, checked_in_at: now })
                .eq('id', guestId);

            if (updateError) {
                alert("Erreur lors de la validation : " + updateError.message);
                resetScanner();
                return;
            }

            // 4. Afficher le succès en vert
            const tableName = guest.tables ? guest.tables.table_name : "Aucune table assignée";
            const companionsText = guest.confirmed_companions > 0 ? ` + ${guest.confirmed_companions} accompagnant(s)` : '';

            resultBox.classList.add('bg-green-600');
            resultIcon.textContent = "✅";
            resultTitle.textContent = "Bienvenue, " + guest.full_name + " !";
            resultDetails.innerHTML = `Accompagnants : <strong>${companionsText || 'Aucun'}</strong><br>Table : <strong class="text-xl underline">${tableName}</strong>`;
            resultBox.classList.remove('hidden');
        }

        // Relancer le scanner pour le prochain invité
        async function resetScanner() {
            document.getElementById('scan-result').classList.add('hidden');
            isScanningActive = true;
            if (html5QrCode) {
                await html5QrCode.resume();
            }
        }

        // Recherche manuelle en cas de panne de QR code
        async function searchGuestManually() {
            const query = document.getElementById('manual-search-input').value.trim();
            const resultsContainer = document.getElementById('manual-search-results');
            resultsContainer.innerHTML = '';

            if (query.length < 2) return;

            const { data: guests } = await supabaseClient
                .from('guests')
                .select('*, tables(table_name)')
                .ilike('full_name', `%${query}%`)
                .limit(5);

            if (!guests || guests.length === 0) {
                resultsContainer.innerHTML = `<p class="text-xs text-slate-400">Aucun invité trouvé.</p>`;
                return;
            }

            guests.forEach(guest => {
                const tableName = guest.tables ? guest.tables.table_name : "Sans table";
                const status = guest.checked_in ? `<span class="text-green-400">Déjà entré</span>` : `<button onclick="verifyAndCheckInGuest('${guest.id}')" class="bg-green-600 px-3 py-1 rounded text-xs font-semibold">Valider entrée</button>`;
                
                resultsContainer.innerHTML += `
                    <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div>
                            <strong>${guest.full_name}</strong><br>
                            <span class="text-slate-400">Table : ${tableName}</span>
                        </div>
                        <div>${status}</div>
                    </div>
                `;
            });
        }

        // Démarrer le scanner au chargement de la page
        window.addEventListener('load', startScanner);
    </script>
</body>
</html>
